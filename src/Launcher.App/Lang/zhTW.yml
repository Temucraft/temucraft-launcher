"Other versions, in degrees: Retail since 9.2.5: 50 to 90, default 90 (up to 120 until a June 2022 hotfix) · Retail before 9.2.5, Vanilla and TBC: about 90, fixed · WotLK: about 110, fixed. Here 100 (the default) keeps the game's own view.": "其他版本（以度為單位）：正式服 9.2.5 起：50 到 90，預設 90（2022 年 6 月熱修復前最高 120）· 9.2.5 之前的正式服、經典舊世和 TBC：約 90，固定 · 巫妖王：約 110，固定。這裡的 100（預設）保持遊戲原本的視野。"
