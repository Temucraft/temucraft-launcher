"Already have WoW 3.3.5a? Cancel and pick its folder under Game files instead.": "Уже есть WoW 3.3.5a? Нажмите «Отмена» и выберите его папку на странице «Файлы игры»."
"Install into:": "Установить в:"
"Total": "Всего"
"This server doesn't hand out the game itself: pick your WoW 3.3.5a folder under Game files.": "Этот сервер не раздаёт саму игру: выберите папку WoW 3.3.5a на странице «Файлы игры»."
"World of Warcraft 3.3.5a (the game)": "World of Warcraft 3.3.5a (игра)"
"{0} files (needed)": "Файлы {0} (обязательно)"
"(none)": "(нет)"
"Free on that drive: {0}": "Свободно на диске: {0}"
"Not enough space: that drive has {0} free": "Недостаточно места: на диске свободно {0}"
"That folder already has the game: it is now your WoW folder.": "В этой папке уже есть игра: теперь это ваша папка WoW."
"MODS": "МОДЫ"
"GAME SETTINGS": "НАСТРОЙКИ ИГРЫ"
"CHECK THE GAME FILES": "ПРОВЕРКА ФАЙЛОВ ИГРЫ"
"News and what changed": "Новости и изменения"
"Where the game is, its languages, downloads, updates and backups": "Где игра, её языки, загрузки, обновления и копии"
"Fixes and extras for the game (DXVK, nicer water...), on or off": "Исправления и дополнения для игры (DXVK, красивая вода...), вкл. или выкл."
"Interface addons": "Аддоны интерфейса"
"The game's own settings: view distance, frame rate, camera, sound": "Настройки самой игры: дальность, частота кадров, камера, звук"
"The launcher itself: your login, language, look, window and privacy": "Сам лаунчер: вход, язык, оформление, окно и приватность"
"Where the game is, which languages to install, downloads, updates and backups.": "Где игра, какие языки ставить, загрузки, обновления и копии."
"The launcher itself: your login, language, look, window and privacy.": "Сам лаунчер: вход, язык, оформление, окно и приватность."
"The game's own settings (WTF\\Config.wtf), and those of DXVK and Awesome WotLK while they are on.": "Настройки самой игры (WTF\\Config.wtf), а также DXVK и Awesome WotLK, пока они включены."
"{0} of {1} that day": "{0} из {1} за день"
"LOOK": "ОФОРМЛЕНИЕ"
"SHARED SETTINGS": "ОБЩИЕ НАСТРОЙКИ"
"Keep my settings (like auto loot), key bindings and macros the same on all my accounts on this PC": "Держать мои настройки (например автодобычу), клавиши и макросы одинаковыми на всех моих учётных записях на этом ПК"
"Also addon settings": "Также настройки аддонов"
"Also between my characters (their own key bindings and macros)": "Также между персонажами (их собственные клавиши и макросы)"
"The newest copy wins, before the game starts and after it closes; a backup is made first. The server can do the same between PCs.": "Побеждает самая новая копия, перед запуском игры и после её закрытия; сначала делается резервная копия. Сервер может делать то же между ПК."
"Share now": "Синхронизировать сейчас"
"Settings shared: {0} brought up to date.": "Настройки синхронизированы: обновлено {0}."
"Settings are already the same everywhere.": "Настройки уже везде одинаковые."
"The server didn't give this PC a play ticket ({0}); the game may not be able to log in.": "Сервер не выдал этому ПК билет на игру ({0}); игра может не войти."
"Loot everything with one click. Default: off.": "Забирать всю добычу одним щелчком. По умолчанию: выкл."
"Left click talks to NPCs and loots. Default: off.": "Левый щелчок: разговор с NPC и добыча. По умолчанию: выкл."
"Highest frame rate while you play. Default: 200.": "Наибольшая частота кадров в игре. По умолчанию: 200."
"Highest frame rate while the game is in the background. Default: 30.": "Наибольшая частота кадров, когда игра в фоне. По умолчанию: 30."
"Play in a window. Default: off.": "Играть в окне. По умолчанию: выкл."
"Fill the screen when playing in a window. Default: off.": "Растянуть окно на весь экран. По умолчанию: выкл."
"Stops screen tearing, adds a little input lag. Default: on.": "Убирает разрывы кадра, немного добавляет задержку. По умолчанию: вкл."
"How far away land is drawn. Default: 777. Max: 1277.": "Дальность прорисовки земли. По умолчанию: 777. Макс.: 1277."
"How far away grass is drawn. Default: 70.": "Дальность прорисовки травы. По умолчанию: 70."
"How thick the grass is. Default: 16.": "Густота травы. По умолчанию: 16."
"How many spell effects you see. Default: 2.": "Сколько эффектов заклинаний видно. По умолчанию: 2."
"How far the camera zooms out. Default: 15. Max: 50.": "Насколько далеко отдаляется камера. По умолчанию: 15. Макс.: 50."
"Multiplies the zoom out distance. Default: 1.": "Умножает дальность отдаления. По умолчанию: 1."
"How the camera follows you: 0 never, 1 smart, 2 always, 4 when moving. Default: 0.": "Как камера следует за вами: 0 никогда, 1 умно, 2 всегда, 4 при движении. По умолчанию: 0."
"Keep the sound on when the game is minimized. Default: off.": "Не выключать звук, когда игра свёрнута. По умолчанию: выкл."
"Voice lines like \"I can't do that yet\". Default: on.": "Фразы вроде «Я пока не могу этого сделать». По умолчанию: вкл."
"How far away nameplates appear. Default: 41 yards.": "Дальность показа индикаторов имён. По умолчанию: 41 м."
"Other versions: Retail 60 yards, TBC and Wrath Classic 41, Classic Era 20.": "Другие версии: Retail 60 м, TBC и Wrath Classic 41, Classic Era 20."
"How wide the camera sees. Higher looks like a fisheye. Default: 100.": "Ширина обзора камеры. Больше похоже на «рыбий глаз». По умолчанию: 100."
"Other versions: Retail 90 (you can pick 50 to 90). 100 here keeps the game's own view.": "Другие версии: Retail 90 (можно от 50 до 90). Здесь 100 оставляет родной обзор игры."
"A smoother frame rate cap than the game's. 0 means no cap. Default: 0.": "Более плавное ограничение кадров, чем у игры. 0: без ограничения. По умолчанию: 0."
"Sharper ground and walls far away. -1 lets the game choose. Default: -1.": "Чётче земля и стены вдали. -1: выбирает игра. По умолчанию: -1."
"Stops screen tearing. -1 lets the game choose, 0 off, 1 on. Default: -1.": "Убирает разрывы кадра. -1: выбирает игра, 0 выкл., 1 вкл. По умолчанию: -1."
"Shows the frame rate in the top left corner. Default: off.": "Показывает частоту кадров в левом верхнем углу. По умолчанию: выкл."
"Copy diagnostics": "Копировать диагностику"
"Copies a short report about your game files. Send it to the server's admin when the game won't start.": "Копирует короткий отчёт о файлах игры. Отправьте его админу сервера, если игра не запускается."
"Diagnostics copied. Paste them in a message to the server's admin.": "Диагностика скопирована. Вставьте её в сообщение админу сервера."
"The game closed right after starting. Try turning off the extras under Mods, then Verify game files. Still broken? Press Copy diagnostics on the Launcher page and send it to the server's admin.": "Игра закрылась сразу после запуска. Выключите дополнения в разделе Моды, затем проверьте файлы игры. Не помогло? Нажмите «Копировать диагностику» на странице Лаунчер и отправьте её админу сервера."
"Updating the launcher first…": "Сначала обновляется лаунчер…"
