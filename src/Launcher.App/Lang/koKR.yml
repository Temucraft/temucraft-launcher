"Log in to get the game files.": "게임 파일을 받으려면 로그인하세요."
"Not logged in: you can play, but updates need your login (Settings, or press UPDATE).": "로그인하지 않았습니다. 플레이는 되지만 업데이트에는 로그인이 필요합니다 (설정 또는 업데이트)."
"Connecting…": "연결 중…"
"This launcher isn't the one the server hands out (it's older, or it was changed). Download the current launcher from the website.": "이 런처는 서버가 배포하는 것과 다릅니다 (더 오래되었거나 바뀌었습니다). 웹사이트에서 최신 런처를 받으세요."
"Connected. There's no game in your WoW folder yet: press INSTALL to download it there.": "연결했습니다. WoW 폴더에 아직 게임이 없습니다. 설치를 눌러 그곳에 내려받으세요."
"Connected. Pick your WoW folder under Settings, or an empty folder to install the game into.": "연결했습니다. 설정에서 WoW 폴더를 고르거나, 게임을 설치할 빈 폴더를 고르세요."
"Everything up to date!": "모두 최신입니다!"
"Update available! {0} file(s), {1} MB to download.": "업데이트가 있습니다! 파일 {0}개, {1}MB를 내려받습니다."
"Backing up your settings and addons…": "설정과 애드온을 백업하는 중…"
"Copying {0} (already on your disk)": "{0} 복사 중 (이미 디스크에 있음)"
"Downloading {0}": "{0} 내려받는 중"
"Downloading {0}  {1} / {2} MB": "{0} 내려받는 중  {1} / {2} MB"
"Game files installed; now the Temucraft files…": "게임 파일을 설치했습니다. 이제 Temucraft 파일…"
