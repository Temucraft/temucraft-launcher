"Stops screen tearing, adds a little input lag. Default: on.": "Évite les déchirures d'image, ajoute un peu de latence. Par défaut : oui."
"How far away land is drawn. Default: 777. Max: 1277.": "Distance d'affichage du terrain. Par défaut : 777. Max. : 1277."
"How far away grass is drawn. Default: 70.": "Distance d'affichage de l'herbe. Par défaut : 70."
"How thick the grass is. Default: 16.": "Densité de l'herbe. Par défaut : 16."
"How many spell effects you see. Default: 2.": "Quantité d'effets de sorts visibles. Par défaut : 2."
"How far the camera zooms out. Default: 15. Max: 50.": "Distance de recul de la caméra. Par défaut : 15. Max. : 50."
"Multiplies the zoom out distance. Default: 1.": "Multiplie la distance de recul. Par défaut : 1."
"How the camera follows you: 0 never, 1 smart, 2 always, 4 when moving. Default: 0.": "Comment la caméra vous suit : 0 jamais, 1 intelligent, 2 toujours, 4 en mouvement. Par défaut : 0."
"Keep the sound on when the game is minimized. Default: off.": "Garder le son quand le jeu est réduit. Par défaut : non."
"Voice lines like \"I can't do that yet\". Default: on.": "Répliques comme « Je ne peux pas encore faire ça ». Par défaut : oui."
"How far away nameplates appear. Default: 41 yards.": "Distance d'affichage des barres de nom. Par défaut : 41 mètres."
"Other versions: Retail 60 yards, TBC and Wrath Classic 41, Classic Era 20.": "Autres versions : Retail 60 mètres, TBC et Wrath Classic 41, Classic Era 20."
"How wide the camera sees. Higher looks like a fisheye. Default: 100.": "Largeur du champ de vision. Plus haut donne un effet fisheye. Par défaut : 100."
"Other versions: Retail 90 (you can pick 50 to 90). 100 here keeps the game's own view.": "Autres versions : Retail 90 (réglable de 50 à 90). Ici, 100 garde la vue d'origine du jeu."
"A smoother frame rate cap than the game's. 0 means no cap. Default: 0.": "Une limite d'images plus fluide que celle du jeu. 0 = pas de limite. Par défaut : 0."
"Sharper ground and walls far away. -1 lets the game choose. Default: -1.": "Sol et murs plus nets au loin. -1 laisse le jeu choisir. Par défaut : -1."
"Stops screen tearing. -1 lets the game choose, 0 off, 1 on. Default: -1.": "Évite les déchirures d'image. -1 laisse le jeu choisir, 0 non, 1 oui. Par défaut : -1."
"Shows the frame rate in the top left corner. Default: off.": "Affiche les images par seconde en haut à gauche. Par défaut : non."
"Copy diagnostics": "Copier le diagnostic"
"Copies a short report about your game files. Send it to the server's admin when the game won't start.": "Copie un court rapport sur vos fichiers de jeu. Envoyez-le à l'admin du serveur si le jeu ne démarre pas."
"Diagnostics copied. Paste them in a message to the server's admin.": "Diagnostic copié. Collez-le dans un message à l'admin du serveur."
"The game closed right after starting. Try turning off the extras under Mods, then Verify game files. Still broken? Press Copy diagnostics on the Launcher page and send it to the server's admin.": "Le jeu s'est fermé juste après le démarrage. Désactivez les extras dans Mods, puis vérifiez les fichiers du jeu. Toujours en panne ? Appuyez sur Copier le diagnostic sur la page Launcher et envoyez-le à l'admin du serveur."
"Updating the launcher first…": "Mise à jour du launcher d'abord…"
"Close the game first, then update the launcher.": "Fermez d'abord le jeu, puis mettez à jour le launcher."
"Server recommends: {0}": "Le serveur conseille : {0}"
"Set by the server. Empty uses the game's own value.": "Réglé par le serveur. Vide = la valeur du jeu."
