"Set by the server. Empty uses the game's own value.": "Vom Server gesetzt. Leer nutzt den Wert des Spiels."
"Open the game folder in your file manager": "Den Spielordner im Dateimanager öffnen"
"Making the report…": "Bericht wird erstellt…"
