"How many spell effects you see. Default: 2.": "Wie viele Zaubereffekte du siehst. Standard: 2."
"How far the camera zooms out. Default: 15. Max: 50.": "Wie weit die Kamera herauszoomt. Standard: 15. Max.: 50."
"Multiplies the zoom out distance. Default: 1.": "Vervielfacht die Zoomdistanz. Standard: 1."
"How the camera follows you: 0 never, 1 smart, 2 always, 4 when moving. Default: 0.": "Wie die Kamera dir folgt: 0 nie, 1 klug, 2 immer, 4 beim Laufen. Standard: 0."
"Keep the sound on when the game is minimized. Default: off.": "Ton anlassen, wenn das Spiel minimiert ist. Standard: aus."
"Voice lines like \"I can't do that yet\". Default: on.": "Sprachzeilen wie \"Das kann ich noch nicht\". Standard: an."
"How far away nameplates appear. Default: 41 yards.": "Wie weit Namensplaketten zu sehen sind. Standard: 41 Meter."
"Other versions: Retail 60 yards, TBC and Wrath Classic 41, Classic Era 20.": "Andere Versionen: Retail 60 Meter, TBC und Wrath Classic 41, Classic Era 20."
"How wide the camera sees. Higher looks like a fisheye. Default: 100.": "Wie weit die Kamera sieht. Höher wirkt wie ein Fischauge. Standard: 100."
"Other versions: Retail 90 (you can pick 50 to 90). 100 here keeps the game's own view.": "Andere Versionen: Retail 90 (wählbar 50 bis 90). 100 behält hier die Sicht des Spiels."
"A smoother frame rate cap than the game's. 0 means no cap. Default: 0.": "Eine sanftere Bildratengrenze als die des Spiels. 0 heißt keine Grenze. Standard: 0."
"Sharper ground and walls far away. -1 lets the game choose. Default: -1.": "Schärferer Boden und Wände in der Ferne. -1 lässt das Spiel wählen. Standard: -1."
"Stops screen tearing. -1 lets the game choose, 0 off, 1 on. Default: -1.": "Verhindert Bildreißen. -1 lässt das Spiel wählen, 0 aus, 1 an. Standard: -1."
"Shows the frame rate in the top left corner. Default: off.": "Zeigt die Bildrate oben links. Standard: aus."
"Copy diagnostics": "Diagnose kopieren"
"Copies a short report about your game files. Send it to the server's admin when the game won't start.": "Kopiert einen kurzen Bericht über deine Spieldateien. Schick ihn dem Admin des Servers, wenn das Spiel nicht startet."
"Diagnostics copied. Paste them in a message to the server's admin.": "Diagnose kopiert. Füge sie in eine Nachricht an den Admin des Servers ein."
"The game closed right after starting. Try turning off the extras under Mods, then Verify game files. Still broken? Press Copy diagnostics on the Launcher page and send it to the server's admin.": "Das Spiel hat sich gleich nach dem Start geschlossen. Schalte die Extras unter Mods aus und prüfe dann die Spieldateien. Immer noch kaputt? Drück auf der Launcher-Seite auf Diagnose kopieren und schick sie dem Admin des Servers."
"Updating the launcher first…": "Zuerst wird der Launcher aktualisiert…"
"Close the game first, then update the launcher.": "Schließ zuerst das Spiel und aktualisiere dann den Launcher."
