"How far the camera zooms out. Default: 15. Max: 50.": "Cuánto se aleja la cámara. Predeterminado: 15. Máx.: 50."
"Multiplies the zoom out distance. Default: 1.": "Multiplica la distancia de la cámara. Predeterminado: 1."
"How the camera follows you: 0 never, 1 smart, 2 always, 4 when moving. Default: 0.": "Cómo te sigue la cámara: 0 nunca, 1 inteligente, 2 siempre, 4 al moverte. Predeterminado: 0."
"Keep the sound on when the game is minimized. Default: off.": "Mantener el sonido con el juego minimizado. Predeterminado: no."
"Voice lines like \"I can't do that yet\". Default: on.": "Frases como \"Todavía no puedo hacer eso\". Predeterminado: sí."
"How far away nameplates appear. Default: 41 yards.": "A qué distancia se ven las placas de nombre. Predeterminado: 41 metros."
"Other versions: Retail 60 yards, TBC and Wrath Classic 41, Classic Era 20.": "Otras versiones: Retail 60 metros, TBC y Wrath Classic 41, Classic Era 20."
"How wide the camera sees. Higher looks like a fisheye. Default: 100.": "Cuánto abarca la cámara. Más alto parece ojo de pez. Predeterminado: 100."
"Other versions: Retail 90 (you can pick 50 to 90). 100 here keeps the game's own view.": "Otras versiones: Retail 90 (se puede elegir de 50 a 90). Aquí 100 mantiene la vista original del juego."
"A smoother frame rate cap than the game's. 0 means no cap. Default: 0.": "Un límite de fotogramas más suave que el del juego. 0 es sin límite. Predeterminado: 0."
"Sharper ground and walls far away. -1 lets the game choose. Default: -1.": "Suelo y paredes más nítidos a lo lejos. -1 deja elegir al juego. Predeterminado: -1."
"Stops screen tearing. -1 lets the game choose, 0 off, 1 on. Default: -1.": "Evita el tearing. -1 deja elegir al juego, 0 no, 1 sí. Predeterminado: -1."
"Shows the frame rate in the top left corner. Default: off.": "Muestra los fotogramas arriba a la izquierda. Predeterminado: no."
"Copy diagnostics": "Copiar diagnóstico"
"Copies a short report about your game files. Send it to the server's admin when the game won't start.": "Copia un informe corto sobre tus archivos del juego. Envíalo al admin del servidor si el juego no arranca."
"Diagnostics copied. Paste them in a message to the server's admin.": "Diagnóstico copiado. Pégalo en un mensaje al admin del servidor."
"The game closed right after starting. Try turning off the extras under Mods, then Verify game files. Still broken? Press Copy diagnostics on the Launcher page and send it to the server's admin.": "El juego se cerró justo al arrancar. Desactiva los extras en Mods y luego verifica los archivos del juego. ¿Sigue fallando? Presiona Copiar diagnóstico en la página Launcher y envíaselo al admin del servidor."
"Updating the launcher first…": "Primero se actualiza el launcher…"
"Close the game first, then update the launcher.": "Cierra primero el juego y luego actualiza el launcher."
